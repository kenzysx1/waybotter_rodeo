<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dado Selvagem - Owlbear Rodeo</title>
  <!-- Owlbear Rodeo SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/lib/index.min.js"></script>
  <style>
    :root {
      --bg-dark: #1e1f22;
      --bg-card: #2b2d31;
      --bg-input: #383a40;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --accent-purple: #7c3aed;
      --accent-purple-hover: #6d28d9;
      --green-success: #2ecc71;
      --orange-warning: #e67e22;
      --red-fail: #e74c3c;
      --red-dark: #992d22;
      --border-color: #3f4147;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 14px;
      font-size: 14px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .player-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: var(--bg-input);
      padding: 4px 8px;
      border-radius: 12px;
      color: var(--text-muted);
    }

    .player-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-success);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-purple);
      color: #fff;
    }

    /* Controls Section */
    .section-card {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .step-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 18px;
      width: 40px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .step-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .stepper-val {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }

    /* Modifier Radio Group */
    .mod-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .mod-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .mod-btn.active {
      background: #4f46e5;
      color: #fff;
      border-color: #6366f1;
    }

    /* Quick input toggle */
    .quick-input-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .text-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 13px;
    }

    .text-input:focus {
      outline: 2px solid var(--accent-purple);
    }

    /* Roll Button */
    .roll-btn {
      width: 100%;
      background: var(--accent-purple);
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
      transition: background 0.15s, transform 0.1s;
    }

    .roll-btn:hover {
      background: var(--accent-purple-hover);
    }

    .roll-btn:active {
      transform: scale(0.98);
    }

    /* Results Card */
    .result-card {
      background: var(--bg-card);
      border-radius: 10px;
      border-left: 6px solid #6b7280;
      padding: 12px;
      margin-bottom: 12px;
      position: relative;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .result-author {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .result-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-desc {
      font-size: 12px;
      color: #d1d5db;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    /* Dice Container */
    .dice-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      justify-content: center;
    }

    /* Single Die */
    .die-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .die-tag {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      color: #c084fc;
      letter-spacing: 0.5px;
    }

    .die {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 6px;
      position: relative;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      border-width: 2px;
      border-style: solid;
      transition: transform 0.2s;
    }

    .die:hover {
      transform: translateY(-2px);
    }

    .pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin: auto;
    }

    /* Die Color Themes */
    .die.wild {
      background: #6b46c1;
      border-color: #9f7aea;
    }
    .die.wild .pip { background: #ffffff; }

    .die.success {
      background: #228b22;
      border-color: #32cd32;
    }
    .die.success .pip { background: #ffffff; }

    .die.complication {
      background: #b22222;
      border-color: #dc143c;
    }
    .die.complication .pip { background: #ffffff; }

    .die.neutral {
      background: #3c4048;
      border-color: #5a5f69;
    }
    .die.neutral .pip { background: #b4b9be; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
      text-align: center;
    }

    .stat-box {
      background: var(--bg-input);
      padding: 6px 4px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stat-val {
      font-size: 14px;
      font-weight: 700;
    }

    /* Pagar Preço Button */
    .btn-pagar {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 9px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-pagar:hover {
      background: #1d4ed8;
    }

    .btn-pagar:disabled {
      background: #4b5563;
      color: #9ca3af;
      cursor: not-allowed;
    }

    /* Feed List */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 480px;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 12px;
      font-size: 13px;
    }

    .badge-paid {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <span>🎲</span>
      <span>Dado Selvagem</span>
    </div>
    <div class="player-badge">
      <span class="player-dot" id="obr-dot"></span>
      <span id="player-name">Conectando...</span>
    </div>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-roll-btn" onclick="switchTab('roll')">Rolador</button>
    <button class="tab-btn" id="tab-feed-btn" onclick="switchTab('feed')">Histórico da Mesa</button>
  </div>

  <!-- Tab 1: Roll Controls -->
  <div id="tab-roll">
    <div class="section-card">
      <!-- Qtd Dados -->
      <div class="form-group">
        <div class="form-label">
          <span>Quantidade de Dados</span>
          <span id="dice-count-label">3d6</span>
        </div>
        <div class="stepper">
          <button class="step-btn" onclick="adjustDice(-1)">−</button>
          <div class="stepper-val" id="dice-count-val">3</div>
          <button class="step-btn" onclick="adjustDice(1)">+</button>
        </div>
      </div>

      <!-- DC -->
      <div class="form-group">
        <div class="form-label">
          <span>Dificuldade (DC)</span>
          <span id="dc-label">DC 1</span>
        </div>
        <div class="stepper">
          <button class="step-btn" onclick="adjustDC(-1)">−</button>
          <div class="stepper-val" id="dc-val">1</div>
          <button class="step-btn" onclick="adjustDC(1)">+</button>
        </div>
      </div>

      <!-- Modificador -->
      <div class="form-group">
        <div class="form-label">
          <span>Modificador</span>
        </div>
        <div class="mod-group">
          <button class="mod-btn active" id="mod-n" onclick="setMod('n')">Normal</button>
          <button class="mod-btn" id="mod-v" onclick="setMod('v')">Vantagem</button>
          <button class="mod-btn" id="mod-d" onclick="setMod('d')">Desvantagem</button>
        </div>
      </div>

      <!-- Quick Command Input -->
      <div class="quick-input-row">
        <input type="text" id="cmd-input" class="text-input" placeholder="Comando rápido (ex: 3 2 v)" onkeydown="if(event.key==='Enter') parseQuickCommand()">
        <button class="step-btn" style="background:var(--bg-input); border-radius:6px; font-size:12px; width:50px;" onclick="parseQuickCommand()">OK</button>
      </div>
    </div>

    <!-- Roll Action -->
    <button class="roll-btn" onclick="executarRolagem()">
      <span>🎲</span>
      <span>ROLAR DADOS</span>
    </button>

    <!-- Latest Result Area -->
    <div id="current-result" style="margin-top: 14px;"></div>
  </div>

  <!-- Tab 2: Table History / Feed -->
  <div id="tab-feed" style="display: none;">
    <div class="feed-container" id="feed-list">
      <div class="empty-state">Nenhuma rolagem feita ainda na mesa.</div>
    </div>
  </div>

  <script>
    // State
    let qtdDados = 3;
    let dc = 1;
    let modo = 'normal'; // 'normal' | 'vantagem' | 'desvantagem'
    let currentPlayer = {
      id: "local-user",
      name: "Jogador"
    };
    let rollHistory = [];
    const BROADCAST_CHANNEL = "br.rpg.dado-selvagem.v1";

    // Pips mapping (grid positions: 1 to 9)
    const PIP_LAYOUTS = {
      1: [5],
      2: [1, 9],
      3: [1, 5, 9],
      4: [1, 3, 7, 9],
      5: [1, 3, 5, 7, 9],
      6: [1, 3, 4, 6, 7, 9]
    };

    // Initialize Owlbear Rodeo SDK
    async function initOBR() {
      if (typeof OBR !== "undefined" && OBR.isAvailable) {
        OBR.onReady(async () => {
          document.getElementById('obr-dot').style.background = "#2ecc71";
          try {
            const name = await OBR.player.getName();
            const id = await OBR.player.getId();
            currentPlayer.name = name || "Jogador";
            currentPlayer.id = id || "user-" + Math.random().toString(36).substring(2, 7);
            document.getElementById('player-name').innerText = currentPlayer.name;
          } catch (e) {
            console.error("Erro ao obter dados do jogador OBR:", e);
          }

          // Register Broadcast Listener
          OBR.broadcast.onMessage(BROADCAST_CHANNEL, (event) => {
            handleIncomingBroadcast(event.data);
          });
        });
      } else {
        // Fallback standalone mode
        document.getElementById('player-name').innerText = "Modo Local";
        document.getElementById('obr-dot').style.background = "#f59e0b";
      }
    }

    // Switch Tabs
    function switchTab(tab) {
      const rollTab = document.getElementById('tab-roll');
      const feedTab = document.getElementById('tab-feed');
      const btnRoll = document.getElementById('tab-roll-btn');
      const btnFeed = document.getElementById('tab-feed-btn');

      if (tab === 'roll') {
        rollTab.style.display = 'block';
        feedTab.style.display = 'none';
        btnRoll.classList.add('active');
        btnFeed.classList.remove('active');
      } else {
        rollTab.style.display = 'none';
        feedTab.style.display = 'block';
        btnRoll.classList.remove('active');
        btnFeed.classList.add('active');
        renderFeed();
      }
    }

    // Controls Logic
    function adjustDice(delta) {
      qtdDados = Math.min(12, Math.max(1, qtdDados + delta));
      document.getElementById('dice-count-val').innerText = qtdDados;
      document.getElementById('dice-count-label').innerText = `${qtdDados}d6`;
    }

    function adjustDC(delta) {
      dc = Math.max(1, dc + delta);
      document.getElementById('dc-val').innerText = dc;
      document.getElementById('dc-label').innerText = `DC ${dc}`;
    }

    function setMod(m) {
      modo = m === 'v' ? 'vantagem' : (m === 'd' ? 'desvantagem' : 'normal');
      document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`mod-${m}`).classList.add('active');
    }

    function parseQuickCommand() {
      const input = document.getElementById('cmd-input');
      const raw = input.value.trim().replace(/^!/, "");
      if (!raw) return;

      const parts = raw.split(/\s+/);
      const q = parseInt(parts[0], 10);
      if (!isNaN(q) && q >= 1 && q <= 12) {
        qtdDados = q;
        document.getElementById('dice-count-val').innerText = qtdDados;
        document.getElementById('dice-count-label').innerText = `${qtdDados}d6`;
      }
      if (parts[1]) {
        const d = parseInt(parts[1], 10);
        if (!isNaN(d) && d >= 1) {
          dc = d;
          document.getElementById('dc-val').innerText = dc;
          document.getElementById('dc-label').innerText = `DC ${dc}`;
        }
      }
      if (parts[2]) {
        const m = parts[2].toLowerCase()[0];
        if (['v', 'd', 'n'].includes(m)) {
          setMod(m);
        }
      }
      input.value = "";
      executarRolagem();
    }

    // Roll Generation
    function executarRolagem() {
      const dado_especial = Math.floor(Math.random() * 6) + 1;
      const dados_normais = [];
      for (let i = 0; i < qtdDados - 1; i++) {
        dados_normais.push(Math.floor(Math.random() * 6) + 1);
      }

      let sucessos = 0;
      let complicacoes = 0;

      // Regras Dado Selvagem
      if (dado_especial === 6) {
        sucessos += 2;
      } else if (dado_especial === 5) {
        sucessos += 1;
      } else if (dado_especial === 4 && modo === 'vantagem') {
        sucessos += 1;
      }

      if (dado_especial === 1) {
        complicacoes += 1;
      } else if (dado_especial === 2 && modo === 'desvantagem') {
        complicacoes += 1;
      }

      // Regras Dados Normais
      for (const d of dados_normais) {
        if (d === 5 || d === 6) {
          sucessos += 1;
        } else if (d === 4 && modo === 'vantagem') {
          sucessos += 1;
        }

        if ((d === 1 || d === 2) && modo === 'desvantagem') {
          complicacoes += 1;
        }
      }

      // Avaliação do Resultado
      let ampliacoes = 0;
      let titulo = "";
      let cor = "";
      let desc = "";

      if (sucessos >= dc) {
        ampliacoes = sucessos - dc;
        if (complicacoes > 0) {
          titulo = "⚠️ SUCESSO COM COMPLICAÇÃO";
          cor = "#E67E22";
          desc = `Alcançou a DC, mas teve <strong>${complicacoes} Complicação(ões)</strong>!`;
        } else if (ampliacoes > 0) {
          titulo = "🌟 SUCESSO AMPLIADO";
          cor = "#2ECC71";
          desc = `Excelente! Superou a DC com <strong>+${ampliacoes} Ampliação(ões)</strong>!`;
        } else {
          titulo = "✅ SUCESSO";
          cor = "#2ECC71";
          desc = "Conseguiu atingir a DC exigida!";
        }
      } else {
        ampliacoes = 0;
        if (complicacoes > 0) {
          titulo = "💀 FALHA CRÍTICA";
          cor = "#992D22";
          desc = `Não atingiu a DC e gerou <strong>${complicacoes} Complicação(ões)</strong>!`;
        } else {
          titulo = "❌ FALHA";
          cor = "#E74C3C";
          desc = "Não obteve sucessos suficientes.";
        }
      }

      const rollObj = {
        id: "roll-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4),
        authorId: currentPlayer.id,
        authorName: currentPlayer.name,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        qtdDados,
        dc,
        modo,
        dado_especial,
        dados_normais,
        sucessos,
        ampliacoes,
        complicacoes,
        titulo,
        cor,
        desc,
        precoPago: false
      };

      // Add to local history & display
      rollHistory.unshift(rollObj);
      renderCurrentResult(rollObj);

      // Broadcast to other players in the Owlbear Rodeo Room
      if (typeof OBR !== "undefined" && OBR.isAvailable) {
        OBR.broadcast.sendMessage(BROADCAST_CHANNEL, {
          type: "NEW_ROLL",
          roll: rollObj
        }, { destination: "ALL" });

        OBR.notification.show(`🎲 ${currentPlayer.name}: ${rollObj.titulo}`);
      }
    }

    // Action: Pagar o Preço
    function pagarPreco(rollId) {
      const roll = rollHistory.find(r => r.id === rollId);
      if (!roll) return;

      if (roll.authorId !== currentPlayer.id) {
        alert("❌ Apenas quem fez a rolagem pode tomar essa decisão!");
        return;
      }

      const custo = Math.min(roll.ampliacoes, roll.complicacoes);
      roll.ampliacoes -= custo;
      roll.complicacoes -= custo;
      roll.sucessos -= custo;
      roll.precoPago = true;

      if (roll.complicacoes === 0) {
        roll.titulo = "✅ SUCESSO (PREÇO PAGO)";
        roll.cor = "#2ECC71";
        roll.desc = `Você pagou o preço! Usou <strong>${custo} Ampliação(ões)</strong> para anular as complicações.`;
      } else {
        roll.titulo = "⚠️ SUCESSO COM COMPLICAÇÃO";
        roll.cor = "#E67E22";
        roll.desc = `Você pagou <strong>${custo} Ampliação(ões)</strong>, mas ainda resta(m) <strong>${roll.complicacoes} Complicação(ões)</strong>!`;
      }

      // Re-render
      renderCurrentResult(roll);
      renderFeed();

      // Broadcast update
      if (typeof OBR !== "undefined" && OBR.isAvailable) {
        OBR.broadcast.sendMessage(BROADCAST_CHANNEL, {
          type: "PAY_PRICE",
          rollId: roll.id,
          sucessos: roll.sucessos,
          ampliacoes: roll.ampliacoes,
          complicacoes: roll.complicacoes,
          titulo: roll.titulo,
          cor: roll.cor,
          desc: roll.desc
        }, { destination: "ALL" });

        OBR.notification.show(`⚖️ ${currentPlayer.name} pagou o preço: ${roll.titulo}`);
      }
    }

    // Handle Broadcast incoming from other players
    function handleIncomingBroadcast(data) {
      if (!data) return;

      if (data.type === "NEW_ROLL") {
        // Prevent duplicate if sent with destination ALL
        if (!rollHistory.some(r => r.id === data.roll.id)) {
          rollHistory.unshift(data.roll);
          renderFeed();
        }
      } else if (data.type === "PAY_PRICE") {
        const roll = rollHistory.find(r => r.id === data.rollId);
        if (roll) {
          roll.sucessos = data.sucessos;
          roll.ampliacoes = data.ampliacoes;
          roll.complicacoes = data.complicacoes;
          roll.titulo = data.titulo;
          roll.cor = data.cor;
          roll.desc = data.desc;
          roll.precoPago = true;
          renderFeed();
          const curr = document.getElementById('current-result');
          if (curr && curr.getAttribute('data-roll-id') === roll.id) {
            renderCurrentResult(roll);
          }
        }
      }
    }

    // Build Dice HTML
    function buildDieHtml(val, isSpecial, modo) {
      let dieClass = "neutral";
      const eh_sucesso = (val === 5 || val === 6) || (val === 4 && modo === 'vantagem');
      const eh_complicacao = (val === 1 && isSpecial) || ((val === 1 || val === 2) && modo === 'desvantagem');

      if (isSpecial) {
        dieClass = "wild";
      } else if (eh_sucesso) {
        dieClass = "success";
      } else if (eh_complicacao) {
        dieClass = "complication";
      }

      const activePips = PIP_LAYOUTS[val] || [];
      let pipsHtml = "";
      for (let i = 1; i <= 9; i++) {
        if (activePips.includes(i)) {
          pipsHtml += `<div class="pip" style="grid-column:${(i-1)%3 + 1}; grid-row:${Math.floor((i-1)/3) + 1};"></div>`;
        }
      }

      return `
        <div class="die-wrapper">
          ${isSpecial ? '<span class="die-tag">Selvagem</span>' : '<span style="height:11px;"></span>'}
          <div class="die ${dieClass}">
            ${pipsHtml}
          </div>
        </div>
      `;
    }

    // Render HTML card for a roll
    function createRollCardHtml(roll, isCurrent = false) {
      const modText = roll.modo === 'vantagem' ? 'Vantagem' : (roll.modo === 'desvantagem' ? 'Desvantagem' : 'Normal');
      
      let diceHtml = buildDieHtml(roll.dado_especial, true, roll.modo);
      for (const d of roll.dados_normais) {
        diceHtml += buildDieHtml(d, false, roll.modo);
      }

      const canPayPrice = (roll.complicacoes > 0 && roll.ampliacoes > 0 && !roll.precoPago);
      const isAuthor = (roll.authorId === currentPlayer.id);

      let buttonHtml = "";
      if (canPayPrice) {
        buttonHtml = `
          <button class="btn-pagar" onclick="pagarPreco('${roll.id}')" ${!isAuthor ? 'disabled title="Apenas o autor pode pagar o preço"' : ''}>
            <span>⚖️</span>
            <span>Pagar o Preço (${Math.min(roll.ampliacoes, roll.complicacoes)} Ampliação)</span>
          </button>
        `;
      } else if (roll.precoPago) {
        buttonHtml = `
          <button class="btn-pagar" disabled>
            <span>⚖️ Preço Pago</span>
          </button>
        `;
      }

      return `
        <div class="result-card" style="border-left-color: ${roll.cor};" data-roll-id="${roll.id}">
          <div class="result-header">
            <span class="result-author">Rolagem de ${roll.authorName}</span>
            <span style="font-size:10px; color:var(--text-muted);">${roll.timestamp}</span>
          </div>

          <div class="result-title" style="color: ${roll.cor};">
            <span>${roll.titulo}</span>
            ${roll.precoPago ? '<span class="badge-paid">Preço Pago</span>' : ''}
          </div>

          <div class="result-desc">${roll.desc}</div>

          <div class="dice-container">
            ${diceHtml}
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-label">🎲 Dados</div>
              <div class="stat-val">${roll.qtdDados}d6 <span style="font-size:10px; color:var(--text-muted);">(${modText})</span></div>
            </div>
            <div class="stat-box">
              <div class="stat-label">🎯 DC</div>
              <div class="stat-val">${roll.dc}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">📊 Sucessos</div>
              <div class="stat-val" style="color:#2ecc71;">${roll.sucessos}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">✨ Ampliações</div>
              <div class="stat-val" style="color:#a855f7;">${roll.ampliacoes > 0 ? '+' + roll.ampliacoes : '0'}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">⚠️ Complicações</div>
              <div class="stat-val" style="color:#e74c3c;">${roll.complicacoes}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">👤 Jogador</div>
              <div class="stat-val" style="font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${roll.authorName}</div>
            </div>
          </div>

          ${buttonHtml}
        </div>
      `;
    }

    function renderCurrentResult(roll) {
      const container = document.getElementById('current-result');
      container.setAttribute('data-roll-id', roll.id);
      container.innerHTML = createRollCardHtml(roll, true);
    }

    function renderFeed() {
      const feed = document.getElementById('feed-list');
      if (rollHistory.length === 0) {
        feed.innerHTML = '<div class="empty-state">Nenhuma rolagem feita ainda na mesa.</div>';
        return;
      }
      feed.innerHTML = rollHistory.map(r => createRollCardHtml(r, false)).join('');
    }

    // Run on startup
    window.addEventListener('DOMContentLoaded', () => {
      initOBR();
    });
  </script>
</body>
</html>
